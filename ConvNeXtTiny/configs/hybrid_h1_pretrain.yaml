seed: 42
data_loader_worker_seed: 42
epochs: 20
warmup_epochs: 2
cosine_end_epoch: 20
mask_ratio: 0.6
mask_unit_pixels: 32
learning_rate_encoder: 1.0e-05
learning_rate_decoder: 0.0002
min_lr_encoder: 5.0e-07
min_lr_decoder: 1.0e-05
weight_decay: 0.01
gradient_clip_norm: 1.0
amp: true
amp_dtype: bfloat16
early_stopping_enabled: false
scheduler_step_unit: optimizer_update
image_budget: 16
grad_accumulation: 2
num_workers: 4
pin_memory: true
optimizer_fused: true
gradient_checkpointing: true
target_effective_images: 32
loss: 0.5*masked_pixel_mse_convnext+0.5*masked_pixel_mse_vit
