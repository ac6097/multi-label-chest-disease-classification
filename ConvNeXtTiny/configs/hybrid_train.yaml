seed: 42
data_loader_worker_seed: 42
epochs: 20
warmup_epochs: 2
cosine_end_epoch: 20
learning_rate_convnext: 1.0e-05
learning_rate_vit: 1.0e-05
learning_rate_head: 0.0002
min_lr_convnext: 5.0e-07
min_lr_vit: 5.0e-07
