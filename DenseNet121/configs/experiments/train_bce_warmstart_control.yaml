# Matched continuation control for the weighted-BCE experiment.
# Starts from the same DenseNet checkpoint as the treatment, with a fresh optimizer.
seed: 42
epochs: 40
image_budget: 16  # Matches the historical best-checkpoint metadata.
grad_accumulation: 2
learning_rate_backbone: 0.00002
learning_rate_head: 0.0002
weight_decay: 0.0001
warmup_epochs: 2
patience: 8
freeze_backbone_epochs: 1
freeze_batchnorm_stats: false
gradient_clip_norm: 1.0

loss: bce
weighting: sqrt
pos_weight_cap: 5.0
gamma_pos: 0.0
gamma_neg: 4.0
asl_clip: 0.05

amp: true
amp_dtype: bfloat16
output_dir: outputs/experiments/dn121_bce_warmstart_control_seed42
resume: ""
